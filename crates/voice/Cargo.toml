[package]
name = "voice"
description = "Moteur vocal : états vocaux du gateway, audio local (cpal) et pont songbird (DAVE inclus)"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
contract.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
thiserror.workspace = true
async-trait = "0.1"
libpulse-binding = "2.30"
libpulse-simple-binding = "2.29"
nnnoiseless = "0.5"
songbird = { version = "0.6", default-features = false, features = ["driver", "gateway", "rustls", "receive", "tungstenite"] }
symphonia-core = "0.5"
# Décodeur PCM requis par la source micro (f32 brut) : absent sans les fonctions par défaut de songbird.
symphonia = { version = "0.5", default-features = false, features = ["pcm"] }
