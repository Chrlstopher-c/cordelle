[workspace]
resolver = "3"
members = ["src-tauri", "crates/*"]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
contract = { path = "crates/contract" }
identity = { path = "crates/identity" }
accounts = { path = "crates/accounts" }
auth = { path = "crates/auth" }
gateway = { path = "crates/gateway" }
rest = { path = "crates/rest" }
store = { path = "crates/store" }
voice = { path = "crates/voice" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.26", features = ["derive"] }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
thiserror = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Dépendances optimisées même en dev : la génération RSA du QR passe de ~8 s à moins d'une seconde.
[profile.dev.package."*"]
opt-level = 2
